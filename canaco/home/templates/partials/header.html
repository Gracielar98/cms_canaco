{% load static %}

<nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" aria-label="Furni navigation bar">
  <div class="container">
    <!-- Logo -->
    <a class="navbar-brand" href="{% url 'home:index' %}">Canaco<span>.</span></a>

    <!-- Botón responsive -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsFurni" aria-controls="navbarsFurni" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarsFurni">
      <!-- Enlaces principales -->
      <ul class="custom-navbar-nav navbar-nav ms-auto mb-2 mb-md-0">
        <li class="nav-item active">
          <a class="nav-link" href="{% url 'home:index' %}">Inicio</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Categoría
          </a>
          <ul class="dropdown-menu border-0 shadow-lg mt-2" aria-labelledby="navbarDropdown" style="background-color: #ffffff; min-width: 180px; border-radius: 10px;">
            <li>
              <a class="dropdown-item py-2 px-3 fw-medium" href="{% url 'home:categoria' %}" style="color: #2f4f4f !important;">Todas</a>
            </li>
            <li>
              <a class="dropdown-item py-2 px-3 fw-medium" href="{% url 'home:categoria' %}" style="color: #2f4f4f !important;">Tecnología</a>
            </li>
          </ul>
        </li>

        <li><a class="nav-link" href="{% url 'home:perfil' %}">Perfil</a></li>
      </ul>

      <!-- Estado de Autenticación -->
      <ul class="custom-navbar-cta navbar-nav mb-2 mb-md-0 ms-5 align-items-center gap-2">
        {% if request.user.is_authenticated %}
          <li class="nav-item">
            <a href="{% url 'home:perfil' %}" class="nav-link text-white fw-semibold">
              <i class="fa-regular fa-user me-1"></i> {{ request.user.username }}
            </a>
          </li>
          <li class="nav-item">
            <form method="post" action="{% url 'home:logout' %}" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-outline-light rounded-pill px-3">Cerrar sesión</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item">
            <a href="{% url 'home:login' %}" class="nav-link text-white">Iniciar sesión</a>
          </li>
          <li class="nav-item">
            <a href="{% url 'home:sign_up' %}" class="btn btn-sm btn-outline-light rounded-pill px-3">Registro</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
