{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}Canaco{% endblock %}</title>
    
    <link rel="shortcut icon" href="{% static 'favicon.png' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'fonts/icomoon/style.css' %}">
    <link rel="stylesheet" href="{% static 'fonts/flaticon/font/flaticon.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/tiny-slider.css' %}">
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <link rel="stylesheet" href="{% static 'css/glightbox.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/flatpickr.min.css' %}">

    <style>
        .panel-shell {
            padding: 36px 0;
            background-color: #f4f6f5;
            min-height: 75vh;
        }
        .panel-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        .panel-sidebar {
            width: 240px;
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        .panel-nav-link {
            color: #2f4f4f;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .panel-nav-link.active,
        .panel-nav-link:hover {
            background-color: #3b5d50;
            color: #ffffff !important;
        }
        .panel-content {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        @media (max-width: 768px) {
            .panel-layout {
                flex-direction: column;
            }
            .panel-sidebar {
                width: 100%;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    {% include "partials/header.html" %}

    <main id="main" class="panel-shell">
        <div class="container">
            <div class="panel-layout">
                {% include "partials/sidebar.html" %}
                <main class="panel-content flex-fill">
                    {% block content %}
                    {% endblock %}
                </main>
            </div>
        </div>
    </main>

    {% include "partials/footer.html" %}

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/tiny-slider.js' %}"></script>
    <script src="{% static 'js/flatpickr.min.js' %}"></script>
    <script src="{% static 'js/aos.js' %}"></script>
    <script src="{% static 'js/glightbox.min.js' %}"></script>
    <script src="{% static 'js/navbar.js' %}"></script>
    <script src="{% static 'js/custom.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
