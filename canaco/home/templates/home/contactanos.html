{% extends 'home/base.html' %}
{% load static %}

{% block title %}Contáctanos - Canaco{% endblock %}

{% block content %}
<div class="hero" style="padding: 3rem 0; background-color: #3b5d50;">
  <div class="container text-center">
    <h1 class="text-white fw-bold">Contáctanos</h1>
    <p class="text-white-50">Envíanos un mensaje y te responderemos a la brevedad.</p>
  </div>
</div>

<div class="untree_co-section" style="padding: 4rem 0;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          <form method="post" action="">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-secondary fw-semibold">Nombre</label>
                <input type="text" name="nombre" class="form-control rounded-3" required>
              </div>
              <div class="col-md-6">
                <label class="form-label text-secondary fw-semibold">Correo Electrónico</label>
                <input type="email" name="email" class="form-control rounded-3" required>
              </div>
              <div class="col-12">
                <label class="form-label text-secondary fw-semibold">Asunto</label>
                <input type="text" name="asunto" class="form-control rounded-3" required>
              </div>
              <div class="col-12">
                <label class="form-label text-secondary fw-semibold">Mensaje</label>
                <textarea name="mensaje" rows="5" class="form-control rounded-3" required></textarea>
              </div>
            </div>
            <button type="submit" class="btn btn-warning rounded-pill px-5 py-3 text-white fw-bold mt-4" style="background-color: #f8b810; border: none;">
              ENVIAR MENSAJE
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
