{% extends 'home/base.html' %}
{% load static %}

{% block title %}Registro - Canaco{% endblock %}

{% block content %}
<div class="hero" style="padding: 3rem 0; background-color: #3b5d50;">
  <div class="container text-center">
    <h1 class="text-white fw-bold">Crear Cuenta</h1>
    <p class="text-white-50">Únete a la plataforma Canaco.</p>
  </div>
</div>

<div class="untree_co-section" style="padding: 4rem 0;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          <form method="post" action="">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-12">
                <label for="username" class="form-label text-secondary fw-semibold">Usuario</label>
                <input type="text" name="username" id="username" class="form-control rounded-3" required>
              </div>
              <div class="col-md-12">
                <label for="email" class="form-label text-secondary fw-semibold">Correo Electrónico</label>
                <input type="email" name="email" id="email" class="form-control rounded-3" required>
              </div>
              <div class="col-md-6">
                <label for="password1" class="form-label text-secondary fw-semibold">Contraseña</label>
                <input type="password" name="password1" id="password1" class="form-control rounded-3" required>
              </div>
              <div class="col-md-6">
                <label for="password2" class="form-label text-secondary fw-semibold">Confirmar Contraseña</label>
                <input type="password" name="password2" id="password2" class="form-control rounded-3" required>
              </div>
            </div>
            <button type="submit" class="btn btn-warning w-100 rounded-pill py-3 text-white fw-bold mt-4 mb-3" style="background-color: #f8b810; border: none;">
              CREAR MI CUENTA
            </button>
            <p class="text-center text-muted mb-0">
              ¿Ya tienes cuenta? <a href="{% url 'home:login' %}" class="fw-bold text-decoration-none" style="color: #3b5d50;">Inicia sesión</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
