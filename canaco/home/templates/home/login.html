{% extends 'home/base.html' %}
{% load static %}

{% block title %}Iniciar Sesión - Canaco{% endblock %}

{% block content %}
<div class="hero" style="padding: 3rem 0; background-color: #3b5d50;">
  <div class="container text-center">
    <h1 class="text-white fw-bold">Iniciar Sesión</h1>
    <p class="text-white-50">Ingresa a tu cuenta para gestionar el portal.</p>
  </div>
</div>

<div class="untree_co-section" style="padding: 4rem 0;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          <form method="post" action="">
            {% csrf_token %}
            <div class="mb-3">
              <label for="username" class="form-label text-secondary fw-semibold">Usuario</label>
              <input type="text" name="username" id="username" class="form-control form-control-lg rounded-3" placeholder="Nombre de usuario" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label text-secondary fw-semibold">Contraseña</label>
              <input type="password" name="password" id="password" class="form-control form-control-lg rounded-3" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 rounded-pill py-3 text-white fw-bold mb-3" style="background-color: #f8b810; border: none;">
              INICIAR SESIÓN
            </button>
            <p class="text-center text-muted mb-0">
              ¿No tienes cuenta? <a href="{% url 'home:sign_up' %}" class="fw-bold text-decoration-none" style="color: #3b5d50;">Regístrate aquí</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
